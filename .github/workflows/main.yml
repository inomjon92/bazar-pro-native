name: Android Kotlin APK Build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        run: |
          gradle wrapper --gradle-version 8.1.1
          chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew :ilova:assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BazarControl-Kotlin-APK
          path: ilova/build/outputs/apk/release/ilova-release-unsigned.apk
